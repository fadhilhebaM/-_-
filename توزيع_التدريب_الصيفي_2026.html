<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:#eef2f7;color:#1e293b;min-height:100vh;}
:root{--navy:#1E2761;--teal:#0EA5A0;--amber:#EF9F27;--green:#3DB370;--coral:#E8593C;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}

/* Header */
.header{background:linear-gradient(135deg,var(--navy) 0%,#2a3d9e 100%);padding:18px 24px;color:white;}
.header-title{font-size:1.35rem;font-weight:900;letter-spacing:-.3px;}
.header-sub{font-size:.78rem;opacity:.7;margin-top:3px;}
.stats-bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.stat-chip{background:rgba(255,255,255,.1);border-radius:8px;padding:7px 14px;display:flex;align-items:center;gap:8px;}
.stat-num{font-size:1.2rem;font-weight:900;}
.stat-lbl{font-size:.72rem;opacity:.75;}
.header-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;}

/* Tabs */
.tabs{background:white;border-bottom:2px solid #e2e8f0;display:flex;padding:0 20px;overflow-x:auto;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.tab{padding:13px 16px;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;font-family:'Cairo',sans-serif;font-size:.86rem;color:#64748b;font-weight:500;transition:all .15s;white-space:nowrap;}
.tab.on{border-bottom-color:var(--teal);color:var(--teal);font-weight:700;}
.tab:hover:not(.on){color:var(--navy);}
.tabs-right{flex:1;}

/* Buttons */
.btn{border:none;border-radius:7px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:all .15s;}
.btn:hover{opacity:.87;transform:translateY(-1px);}
.btn:active{transform:none;}
.btn-teal{background:var(--teal);color:white;}
.btn-amber{background:var(--amber);color:white;}
.btn-gray{background:#f1f5f9;color:#475569;}
.btn-danger{background:#fee2e2;color:#ef4444;}
.btn-sm{padding:6px 12px;font-size:.78rem;}
.btn-md{padding:9px 18px;font-size:.86rem;}
.btn-lg{padding:11px 22px;font-size:.92rem;}

/* Content */
.content{padding:20px;}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
select,input[type=text]{font-family:'Cairo',sans-serif;font-size:.83rem;border:1.5px solid #e2e8f0;border-radius:7px;padding:8px 11px;background:white;color:#1e293b;outline:none;transition:border-color .15s;}
select:focus,input:focus{border-color:var(--teal);}

/* Table */
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.8rem;}
thead tr{background:var(--navy);}
th{padding:12px 10px;text-align:right;color:white;font-weight:700;white-space:nowrap;font-size:.82rem;}
tbody tr{transition:background .1s;}
tbody tr:hover td{background:#f0fdf9!important;}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;}
.badge{display:inline-block;padding:2px 9px;border-radius:4px;font-size:.72rem;color:white;white-space:nowrap;}
.manual-badge{background:#fef9c3;color:#854d0e;border-radius:4px;padding:1px 7px;font-size:.7rem;font-weight:700;}

/* Summary cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.sum-card{background:white;border-radius:11px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.mini-bar-track{background:#f1f5f9;border-radius:3px;height:5px;margin-top:2px;}
.mini-bar-fill{border-radius:3px;height:5px;transition:width .4s;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;animation:fi .15s;}
.modal{background:white;border-radius:14px;padding:24px;width:92%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:su .2s;}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-sel{width:100%;padding:11px 14px;border-radius:8px;border:2px solid var(--teal);font-family:'Cairo',sans-serif;font-size:.95rem;margin-top:10px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}

/* Manage list */
.min-item{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid #f1f5f9;}
.num-circle{width:26px;height:26px;background:var(--navy);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;margin-left:10px;flex-shrink:0;}

/* Changes log */
.change-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #f1f5f9;}
.arrow{margin:0 6px;color:var(--amber);}

/* Empty state */
.empty{text-align:center;padding:40px;color:#94a3b8;}
.empty-icon{font-size:2.5rem;margin-bottom:10px;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:10px 22px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:9999;animation:fi .2s;box-shadow:0 4px 20px rgba(0,0,0,.25);}

/* Print styles */
@media print{
  .tabs,.header-btns,.filters .btn,button{display:none!important;}
  .content{padding:0;}
  .card{box-shadow:none;border:1px solid #e2e8f0;}
}
</style>

let state={tab:'table',fDept:'الكل',fGov:'الكل',search:'',modal:null,overrides:{},history:[],newMinName:'',newMinCity:''};

// ===================== LOGIC =====================
function hav([la1,lo1],[la2,lo2]){
  const R=6371,t=x=>x*Math.PI/180;
  const a=Math.sin(t(la2-la1)/2)**2+Math.cos(t(la1))*Math.cos(t(la2))*Math.sin(t(lo2-lo1)/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function nearest(gov){
  const c=GOV_COORDS[gov]||GOV_COORDS['بغداد'];
  let best=null,bd=Infinity;
  for(const m of ministries){const d=hav(c,m.coords);if(d<bd){bd=d;best=m;}}
  return{name:best?.name||'-',city:best?.city||'-',dist:Math.round(bd),coords:best?.coords||[33.34,44.40]};
}
function getAssigned(){
  return STUDENTS.map(([id,name,dept,gov,boarding])=>{
    const auto=nearest(gov);
    const manual=state.overrides[id];
    const mObj=ministries.find(m=>m.name===(manual||auto.name));
    const mName=mObj?.name||auto.name;
    const mCity=mObj?.city||auto.city;
    const dist=Math.round(hav(GOV_COORDS[gov]||GOV_COORDS['بغداد'],mObj?.coords||auto.coords));
    return{id,name,dept,gov,boarding,mName,mCity,dist,isManual:!!manual,autoMin:auto.name};
  });
}
function getSummary(assigned){
  const m={};
  for(const s of assigned){
    if(!m[s.mName])m[s.mName]={city:s.mCity,students:[],boarding:0};
    m[s.mName].students.push(s);
    if(s.boarding==='نعم')m[s.mName].boarding++;
  }
  return Object.entries(m).sort((a,b)=>b[1].students.length-a[1].students.length);
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2400);
}

// ===================== ACTIONS =====================
function applyOverride(id,newName){
  const assigned=getAssigned();
  const old=state.overrides[id]||assigned.find(s=>s.id===id)?.autoMin;
  state.history.push({id,from:old,to:newName,time:new Date().toLocaleTimeString('ar-IQ')});
  const auto=assigned.find(s=>s.id===id)?.autoMin;
  if(newName===auto)delete state.overrides[id];
  else state.overrides[id]=newName;
  state.modal=null;render();toast('✅ تم تغيير الجهة');
}
function undoChange(idx){
  const h=state.history[idx];
  state.history.splice(idx,1);
  const assigned=getAssigned();
  const auto=assigned.find(s=>s.id===h.id)?.autoMin;
  if(h.from===auto||!h.from)delete state.overrides[h.id];
  else state.overrides[h.id]=h.from;
  render();toast('↩ تم التراجع');
}
function exportExcel(){
  const assigned=getAssigned();
  const d=assigned.map(s=>({'ت':s.id,'اسم الطالب':s.name,'القسم العلمي':s.dept,'المحافظة':s.gov,'داخلي':s.boarding,'الجهة المقترحة للتدريب':s.mName,'مدينة الجهة':s.mCity,'المسافة (كم)':s.dist,'تعديل يدوي':s.isManual?'نعم':''}));
  const ws=XLSX.utils.json_to_sheet(d);
  ws['!cols']=[{wch:4},{wch:38},{wch:22},{wch:14},{wch:8},{wch:40},{wch:14},{wch:12},{wch:12}];
  const sum=getSummary(assigned).map(([n,{city,students,boarding}])=>({'الجهة':n,'المدينة':city,'إجمالي الطلبة':students.length,'منهم داخليون':boarding}));
  const ws2=XLSX.utils.json_to_sheet(sum);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'جدول التوزيع');
  XLSX.utils.book_append_sheet(wb,ws2,'ملخص الجهات');
  XLSX.writeFile(wb,'توزيع_التدريب_الصيفي_2026.xlsx');
  toast('⬇️ جاري تحميل ملف Excel');
}

function openM(s){state.modal=s;render();}
function doOverride(){
  const sel=document.getElementById('msel');
  if(sel)applyOverride(state.modal.id,sel.value.split(' — ')[0]);
}
function addMin(){
  const n=document.getElementById('nn')?.value.trim()||state.newMinName;
  const c=document.getElementById('nc')?.value||state.newMinCity;
  if(!n||!c){toast('⚠️ يرجى إدخال الاسم والمدينة');return;}
  ministries.push({id:Math.max(...ministries.map(m=>m.id))+1,name:n,city:c,coords:GOV_COORDS[c]||[33.34,44.40]});
  state.newMinName='';state.newMinCity='';
  render();toast(`✅ تمت إضافة: ${n}`);
}
function removeMin(id){
  const m=ministries.find(x=>x.id===id);
  if(confirm(`هل تريدين حذف "${m?.name}"؟`)){
    ministries=ministries.filter(x=>x.id!==id);render();toast('🗑️ تم الحذف');
  }
}
window.S=S;window.openM=openM;window.doOverride=doOverride;
window.applyOverride=applyOverride;window.undoChange=undoChange;
window.exportExcel=exportExcel;window.addMin=addMin;window.removeMin=removeMin;

render();
</script>
